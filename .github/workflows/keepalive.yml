name: Keep Alive Render Server

on:
  schedule:
    # Runs every 5 minutes 24/7 to prevent Render container from sleeping
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SLEEP2K Render App
        run: |
          curl -s -f -A "GitHub-KeepAlive-Bot" https://sleep2k.onrender.com/ > /dev/null
          echo "Successfully pinged https://sleep2k.onrender.com at $(date)"
